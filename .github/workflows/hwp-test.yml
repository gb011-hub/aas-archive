# 시험용 (hwp-test 브랜치 전용): hwp를 PDF로 자동 변환할 수 있는지 HTML 경로로 확인한다.
#   pyhwp hwp5html → HTML → Chrome으로 PDF
# 결과는 hwp-test-output/ 에 커밋한다. main 브랜치와 데이터베이스에는 영향이 없다.
name: hwp 변환 시험

on:
  push:
    branches: [hwp-test]
    paths:
      - "hwp-test-input/**"
      - ".github/workflows/hwp-test.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  convert:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: pyhwp 준비 (패키지 빌드 단계가 오래되어 소스에서 직접 사용)
        run: |
          python -m pip install --quiet "cryptography" "lxml" "olefile>=0.43" "six"
          python -m pip download --quiet --no-deps --no-binary :all: -d /tmp/pkgs pyhwp==0.1b15
          tar -xzf /tmp/pkgs/pyhwp-0.1b15.tar.gz -C /tmp
          echo "PYTHONPATH=/tmp/pyhwp-0.1b15/src" >> "$GITHUB_ENV"

      - name: LibreOffice · 한글 글꼴 설치
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends libreoffice-writer fonts-noto-cjk fonts-nanum

      - name: 변환 시험
        run: |
          mkdir -p hwp-test-output && rm -f hwp-test-output/*.pdf
          log=hwp-test-output/log.txt
          : > "$log"
          cat > /tmp/fit.js <<'JS'
          (function () {
            var avail = 718, log = [];
            function widest() {
              var best = null, maxR = 0, els = document.querySelectorAll('table,img,svg,div,p');
              for (var i = 0; i < els.length; i++) {
                var r = els[i].getBoundingClientRect();
                if (r.right > maxR) { maxR = r.right; best = els[i]; }
              }
              return [best, maxR];
            }
            var w0 = widest();
            log.push('widest ' + (w0[0] ? w0[0].tagName + '.' + (w0[0].className || '') : '-') + ' ' + Math.round(w0[1]));
            // 1) 넘치는 표는 페이지 폭으로 다시 배치
            var tables = document.querySelectorAll('table'), fixed = 0, zoomed = 0, minz = 1;
            for (var i = 0; i < tables.length; i++) {
              var t = tables[i];
              if (t.getBoundingClientRect().right <= avail) continue;
              t.style.width = '100%'; t.style.maxWidth = '100%'; t.style.tableLayout = 'auto';
              var cells = t.querySelectorAll('td,th,col');
              for (var j = 0; j < cells.length; j++) { cells[j].style.width = 'auto'; cells[j].style.wordBreak = 'break-all'; }
              fixed++;
            }
            // 2) 그래도 넘치는 표만 따로 축소 (최소 60%)
            for (var i = 0; i < tables.length; i++) {
              var t = tables[i], r = t.getBoundingClientRect();
              if (r.right <= avail || t.parentElement.closest('table')) continue;
              var z = Math.max(0.6, (avail - r.left) / r.width);
              t.style.zoom = z; zoomed++; if (z < minz) minz = z;
            }
            var w1 = widest();
            log.push('reflow ' + fixed + ' zoom ' + zoomed + ' min ' + minz.toFixed(2) + ' final ' + Math.round(w1[1]));
            document.title = log.join(' | ');
          })();
          JS
          for f in hwp-test-input/*.hwp; do
            name=$(basename "$f" .hwp)
            echo "=== $name ($(du -h "$f" | cut -f1))" | tee -a "$log"

            start=$(date +%s)
            if python -c "import sys; from hwp5.hwp5html import main; sys.argv=['hwp5html']+sys.argv[1:]; main()" \
                 --output "/tmp/html_$name" "$f" >> "$log" 2>&1; then
              # 인쇄용: A4(좌우 여백 10mm), 글꼴은 나눔고딕 하나로 통일(한글·영문 기준선 차이로 흔들려 보이는 문제),
              # 넘치는 그림은 페이지 폭에 맞추고, 넘치는 표는 페이지 폭으로 다시 배치, 그래도 넘치면 그 표만 축소(최소 60%)
              python - "/tmp/html_$name/index.xhtml" <<'PY'
          import sys
          p = sys.argv[1]
          s = open(p, encoding="utf-8").read()
          css = ("<style type=\"text/css\">@page{size:A4;margin:12mm 10mm}"
                 "html,body{margin:0!important;padding:0!important;background:#fff!important}"
                 ".Paper{margin:0!important;padding:0!important;width:auto!important;"
                 "box-shadow:none!important;border:0!important}"
                 "img{max-width:100%!important;height:auto!important}"
                 "*{font-family:'NanumGothic','Noto Sans CJK KR',sans-serif!important}</style>")
          js = ("<script type=\"text/javascript\">//<![CDATA[\n" + open("/tmp/fit.js", encoding="utf-8").read() + "\n//]]></script>")
          s = s.replace("</head>", css + "</head>", 1).replace("</body>", js + "</body>", 1)
          open(p, "w", encoding="utf-8").write(s)
          PY
              google-chrome --headless=new --no-sandbox --disable-gpu --window-size=718,1000 \
                --print-to-pdf="hwp-test-output/${name}_A4.pdf" --no-pdf-header-footer \
                "file:///tmp/html_$name/index.xhtml" >> "$log" 2>&1 \
                && echo "변환 성공 ($(( $(date +%s) - start ))초)" | tee -a "$log" \
                || echo "Chrome PDF 실패" | tee -a "$log"
            else
              echo "hwp5html 실패" | tee -a "$log"
            fi
          done
          ls -la hwp-test-output | tee -a "$log"

      - name: 결과 커밋 (hwp-test 브랜치)
        if: always()
        run: |
          git add -A hwp-test-output
          git diff --cached --quiet && exit 0
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "hwp 변환 시험 결과"
          git push
